{% extends "layout_emp.html" %}

{% block page_title %}NUEVO MATERIAL{% endblock %}

{% block container %}
<div class="management-header fade-up">
    <div style="display: flex; align-items: center; gap: 15px;">
        <a href="{{ url_for('materia_prima.listar') }}" style="color: var(--muted2); font-size: 28px;">
            <i class="ph ph-arrow-left"></i>
        </a>
        <div>
            <h2 style="margin: 0; letter-spacing: 1px;">REGISTRAR NUEVO MATERIAL</h2>
            <p style="font-size: 11px; color: var(--muted2); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px;">
                Alta de insumos para el catálogo de inventario
            </p>
        </div>
    </div>
</div>

<div class="form-container fade-up" style="max-width: 850px; margin: 0 auto; background: var(--surface); padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.3);">
    
    <form action="{{ url_for('materia_prima.registrar') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label style="display: block; margin-bottom: 15px; color: var(--blue); font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;">1. Información General</label>
        
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-bottom: 25px;">
            <div class="form-group">
                <label style="color: var(--muted2); font-size: 12px; font-weight: 800; display: block; margin-bottom: 10px;">NOMBRE DEL MATERIAL</label>
                <input type="text" name="nombre" class="btn" 
                       style="width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px;" 
                       placeholder="Ej. Madera MDF 18mm" required>
            </div>
            <div class="form-group">
                <label style="color: var(--muted2); font-size: 12px; font-weight: 800; display: block; margin-bottom: 10px;">MARCA / FABRICANTE</label>
                <input type="text" name="marca" class="btn" 
                       style="width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px;" 
                       placeholder="Ej. Arauco" required>
            </div>
        </div>

        <label style="display: block; margin-bottom: 15px; color: var(--blue); font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;">2. Costos y Adquisición</label>
        
        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px; margin-bottom: 25px;">
            <div class="form-group">
                <label style="color: var(--muted2); font-size: 12px; font-weight: 800; display: block; margin-bottom: 10px;">PRECIO UNITARIO ($)</label>
                <div style="position: relative;">
                    <span style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--green); font-weight: 800;">$</span>
                    <input type="number" name="precio" step="0.0001" class="btn" 
                           style="width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px 12px 12px 30px;" 
                           placeholder="0.00" required>
                </div>
                <small style="color: var(--muted); font-size: 10px; margin-top: 5px; display: block;">* Ingrese el costo por gramo o mililitro.</small>
            </div>
            <div class="form-group">
                <label style="color: var(--muted2); font-size: 12px; font-weight: 800; display: block; margin-bottom: 10px;">PROVEEDOR</label>
                <select name="id_proveedor" class="btn" 
                        style="width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; cursor: pointer;" required>
                    <option value="" disabled selected>Seleccione un proveedor...</option>
                    {% for p in proveedores %}
                        <option value="{{ p.IdProveedor }}">{{ p.NombreEmpresa }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <label style="display: block; margin-bottom: 15px; color: var(--blue); font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;">3. Control de Inventario</label>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px;">
            <div class="form-group">
                <label style="color: var(--muted2); font-size: 12px; font-weight: 800; display: block; margin-bottom: 10px;">UNIDAD DE MEDIDA BASE</label>
                <select name="id_unidad_medida" class="btn" 
                        style="width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; cursor: pointer;" required>
                    <option value="1">Gramos (g)</option>
                    <option value="2">Mililitros (ml)</option>
                </select>
            </div>
            <div class="form-group">
                <label style="color: var(--muted2); font-size: 12px; font-weight: 800; display: block; margin-bottom: 10px;">STOCK MÍNIMO (ALERTA)</label>
                <input type="number" name="stock_minimo" step="0.01" class="btn" 
                       style="width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px;" 
                       placeholder="Ej. 500" required>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 35px;">
            <label style="color: var(--muted2); font-size: 12px; font-weight: 800; display: block; margin-bottom: 10px;">DESCRIPCIÓN DEL MATERIAL</label>
            <textarea name="descripcion" rows="3" class="btn" 
                      style="width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); resize: none; padding: 15px;"
                      placeholder="Detalles sobre el material, dimensiones o uso recomendado..." required></textarea>
        </div>

        <div style="display: flex; gap: 20px; border-top: 1px solid var(--border); padding-top: 30px;">
            <button type="submit" class="btn-add" 
                    style="flex: 2; height: 55px; justify-content: center; background: var(--blue); border-radius: 12px; font-size: 16px; font-weight: 800; gap: 12px; cursor: pointer; border: none; color: white;">
                <i class="ph ph-plus-circle" style="font-size: 22px;"></i> GUARDAR MATERIAL
            </button>
            <a href="{{ url_for('materia_prima.listar') }}" class="btn" 
               style="flex: 1; height: 55px; background: transparent; border: 1px solid var(--border); color: var(--muted2); text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; border-radius: 12px;">
                CANCELAR
            </a>
        </div>
    </form>
</div>
{% endblock %}
