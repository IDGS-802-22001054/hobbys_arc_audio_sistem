{% extends "layout_emp.html" %}

{% block page_title %}Cambiar Contraseña{% endblock %}

{% block container %}

<div class="page-header fade-up">
    <h2 class="page-header-title">CAMBIO OBLIGATORIO DE CONTRASEÑA</h2>
</div>

<div class="form-grid fade-up" style="max-width: 520px; margin: 0 auto; animation-delay: 0.07s;">
    <div class="form-section">
        <div class="form-section-title">
            <i class="ph ph-shield-warning"></i> Primera sesión — Actualiza tu contraseña
        </div>

        <p style="margin-bottom: 1.25rem; color: var(--color-text-muted, #6b7280);">
            Por seguridad, debes cambiar la contraseña temporal que te asignó
            antes de continuar.
        </p>

        <form method="POST" action="{{ url_for('empleados.cambiar_credenciales') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="password">Nueva contraseña</label>
                <input type="password" id="password" name="password"
                       class="form-input" placeholder="Mínimo 8 caracteres"
                       required minlength="8">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmar_password">Confirmar contraseña</label>
                <input type="password" id="confirmar_password" name="confirmar_password"
                       class="form-input" placeholder="Repite la contraseña"
                       required minlength="8">
            </div>

            <div class="form-actions" style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-blue" style="width: 100%;">
                    <i class="ph ph-check"></i> Guardar y continuar
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
